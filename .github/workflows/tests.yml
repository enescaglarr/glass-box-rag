name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # No API key is set here on purpose. The unit tests cover the pure logic -
      # retrieval selection, output parsing, prompt assembly - and must run without
      # credentials. eval.py, which does call the API, is run manually.
      - name: Run unit tests
        run: pytest
